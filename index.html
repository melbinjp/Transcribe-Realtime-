<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Transcription</title>
  <meta name="description" content="Transcribe speech to text in your browser, in real time.">
  <link rel="canonical" href="https://melbinjp.github.io/Transcribe-Realtime-/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="WeCanUseAI">
  <meta property="og:title" content="Real-Time Transcription">
  <meta property="og:description" content="Transcribe speech to text in your browser, in real time.">
  <meta property="og:url" content="https://melbinjp.github.io/Transcribe-Realtime-/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Real-Time Transcription">
  <meta name="twitter:description" content="Transcribe speech to text in your browser, in real time.">
  <link rel="icon" type="image/x-icon" href="https://favicon.wecanuseai.com/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="https://favicon.wecanuseai.com/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://favicon.wecanuseai.com/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://favicon.wecanuseai.com/apple-touch-icon-180x180.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="top-panel">
      <header>
        <h1>Real-Time Transcription</h1>
        <p>Transcribe audio in real-time with timestamps.</p>
      </header>

      <!-- Controls Section -->
      <div class="controls">
        <button id="start-btn" class="button">Start Transcription</button>
        <button id="stop-btn" class="button" disabled>Stop Transcription</button>
        <select id="language-select" class="dropdown">
          <option value="en-GB" selected>English (UK)</option>
          <option value="ml-IN">Malayalam</option>
          <option value="hi-IN">Hindi</option>
        </select>
        <button id="download-btn" class="button" disabled>Download SRT</button>
      </div>
    </div>

    <!-- Transcription Box -->
    <div class="transcription-container">
      <textarea id="transcription" placeholder="Transcribed text will appear here..." readonly></textarea>
    </div>

  </div>

  <script src="script.js"></script>

  <footer role="contentinfo" class="wcua-footer">
    <p>&copy; <span class="copyright-year"></span> WeCanUseAI. Empowering creativity with AI.</p>
    <nav class="wcua-footer-links" aria-label="Footer navigation">
      <a href="https://wecanuseai.com/">Home</a>
      <a href="https://wecanuseai.com/privacy.html">Privacy</a>
      <a href="https://wecanuseai.com/terms.html">Terms</a>
      <a href="https://wecanuseai.com/contact.html">Contact</a>
    </nav>
  </footer>
  <script>
    document.querySelectorAll('.copyright-year').forEach(el => {
      el.textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
